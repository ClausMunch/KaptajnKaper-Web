version: '3.9'

services:
  kaptajn-kaper-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: kaptajn-kaper-prod
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
    volumes:
      - leaderboard-data:/data
    networks:
      - kaptajn-network
    restart: unless-stopped

networks:
  kaptajn-network:
    driver: bridge

volumes:
  leaderboard-data:
